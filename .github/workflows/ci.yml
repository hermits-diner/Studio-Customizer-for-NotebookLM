name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          node --check background.js
          node --check content.js
          node --check sidepanel/templates.js
          node --check sidepanel/panel.js
      - name: Unit tests
        run: node tests/run.js
      - name: Validate manifest & selectors JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('selectors.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('_locales/en/messages.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('_locales/ko/messages.json','utf8'))"
