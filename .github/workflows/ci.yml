name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          node --check background.js
          node --check content.js
          node --check sidepanel/templates.js
          node --check sidepanel/panel.js
      - name: Unit tests
        run: node tests/run.js
      - name: Validate manifest, selectors & all locales (incl. 132-char store limit)
        run: node tests/checks.js
